{% extends 'MyAccountBase.html' %}
{% load static %}

{% block title %}Payment Failed - ShopZone{% endblock %}

{% block content %}
<div class="payment-status-page">
    <div class="container">
        <div class="status-card failed">
            <div class="status-icon">
                <svg width="80" height="80" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                </svg>
            </div>
            
            <h1>Payment Failed</h1>
            <p>Unfortunately, your payment could not be processed.</p>
            
            <div class="status-actions">
                <a href="{% url 'MyStore:checkout' %}" class="btn btn-primary">
                    Try Again
                </a>
                <a href="{% url 'MyAccount:home' %}" class="btn btn-outline">
                    Go to Home
                </a>
            </div>
            
            <div class="help-text">
                <p>Need help? <a href="{% url 'MyAccount:contact' %}">Contact Support</a></p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
