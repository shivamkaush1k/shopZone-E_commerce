<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | Login App</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: var(--color-text);
            background-color: var(--color-background);
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--color-cream-50) 0%, var(--color-cream-100) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        :root {
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-border: rgba(94, 82, 64, 0.2);
            --color-success: #22c55e;
            --space-16: 16px;
            --space-24: 24px;
            --space-32: 32px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .reset-container {
            width: 100%;
            max-width: 500px;
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--space-32);
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon-wrapper {
            margin-bottom: var(--space-32);
            animation: scaleIn 0.6s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        .success-icon::after {
            content: '✓';
            font-size: 40px;
            color: white;
            font-weight: bold;
            animation: checkmark 0.6s ease-out 0.4s both;
        }

        @keyframes checkmark {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .reset-complete-heading {
            font-size: 28px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .reset-complete-subheading {
            font-size: 16px;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-24);
            line-height: 1.6;
        }

        .info-box {
            background: rgba(33, 128, 141, 0.08);
            border: 1px solid rgba(33, 128, 141, 0.15);
            border-radius: 8px;
            padding: var(--space-16);
            margin-bottom: var(--space-24);
            text-align: left;
        }

        .info-box-title {
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-box-text {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        .info-box ul {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .info-box li {
            margin: 6px 0;
            color: var(--color-text-secondary);
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-16);
            margin-top: var(--space-32);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            text-decoration: none;
            width: 100%;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(33, 128, 141, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }

        .btn-secondary:hover {
            background: rgba(33, 128, 141, 0.08);
        }

        .footer-text {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-top: var(--space-24);
            padding-top: var(--space-24);
            border-top: 1px solid var(--color-border);
        }

        .footer-text a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-text a:hover {
            color: var(--color-primary-hover);
            text-decoration: underline;
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: rgba(31, 33, 33, 1);
                --color-surface: rgba(38, 40, 40, 1);
                --color-text: rgba(245, 245, 245, 1);
                --color-text-secondary: rgba(167, 169, 169, 0.7);
                --color-border: rgba(119, 124, 124, 0.2);
            }

            body {
                background: linear-gradient(135deg, rgba(31, 33, 33, 1) 0%, rgba(38, 40, 40, 1) 100%);
            }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .reset-container {
                padding: var(--space-24);
            }

            .reset-complete-heading {
                font-size: 24px;
            }

            .reset-complete-subheading {
                font-size: 14px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
            }

            .success-icon::after {
                font-size: 35px;
            }

            .button-container {
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <!-- Success Icon -->
        <div class="success-icon-wrapper">
            <div class="success-icon"></div>
        </div>

        <!-- Heading -->
        <h1 class="reset-complete-heading">Password Reset Complete!</h1>
        <p class="reset-complete-subheading">
            Your password has been successfully reset. You can now log in with your new password.
        </p>

        <!-- Info Box -->
        <div class="info-box">
            <div class="info-box-title">Security Tips</div>
            <ul class="info-box">
                <li>Never share your password with anyone</li>
                <li>Use a strong, unique password</li>
                <li>Log out on shared devices after use</li>
            </ul>
        </div>

        <!-- Buttons -->
        <div class="button-container">
            <a href="{% url 'login:login' %}" class="btn btn-primary">Back to Login</a>
            <a href="{% url 'login:home' %}" class="btn btn-secondary">Go to Home</a>
        </div>

        <!-- Footer -->
        <p class="footer-text">
        </p>
    </div>
</body>
</html>
