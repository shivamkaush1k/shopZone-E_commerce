{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | ShopZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/forgotpassword.css' %}" />
</head>
<body>
  <div class="forgot-container">
    <div class="forgot-card">
      <div class="forgot-header">
        <h2><i class="fas fa-unlock-alt"></i> Forgot Password</h2>
        <p>Enter your email to receive a password reset link.</p>
      </div>

      {% if messages %}
        <div class="messages-container">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              <i class="fas 
                {% if message.tags == 'success' %}fa-check-circle
                {% elif message.tags == 'danger' %}fa-exclamation-circle
                {% elif message.tags == 'warning' %}fa-exclamation-triangle
                {% else %}fa-info-circle
                {% endif %}
              "></i>
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form id="forgotForm" class="forgot-form" method="post" novalidate>
        {% csrf_token %}
        <div class="input-group">
          <label for="email" class="form-label">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
          <div class="invalid-feedback">
            Please enter a valid email address.
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <i class="fas fa-paper-plane"></i> Send Reset Link
          <span class="spinner-border d-none" id="submitSpinner"></span>
        </button>

        <div class="links">
          <a href="{% url 'login:login' %}">
            <i class="fas fa-sign-in-alt"></i> Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="{% static 'js/forgotpassword.js' %}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
